name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        run: cd dist && zip -qr ../dist.zip . && cd .. && ls -la dist.zip
      - name: Publish build artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest build
          body: |
            由 GitHub Actions 构建。本机同步：
            `bash scripts/sync.sh`
          files: dist.zip
          make_latest: true
