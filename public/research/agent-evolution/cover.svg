<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 830" role="img" aria-labelledby="title desc"><title id="title">智能体的演进</title><desc id="desc">2026 年 11 月研究专刊，从个人代理到持续任务与研究知识，Hanlin Li。</desc><rect width="620" height="830" fill="#20352e"/><path d="M45 66 H575 M45 758 H575" stroke="#6c7d6d"/><g fill="#f4f0e7" font-family="sans-serif"><text x="45" y="43" font-size="12" letter-spacing="2">HANLIN LI / RESEARCH</text><text x="575" y="43" text-anchor="end" font-size="12">2026.11</text><text x="45" y="124" fill="#efb18d" font-size="13" letter-spacing="2">AGENT EVOLUTION</text><text x="45" y="238" font-size="76" font-family="serif">智能体的</text><text x="45" y="332" font-size="80" fill="#efb18d" font-family="serif">演进</text><text x="45" y="395" font-size="21">从个人代理、数字角色与团队协作</text><text x="45" y="431" font-size="21">到持续任务和可复用的研究知识</text></g><g fill="none" stroke-width="1.6"><path d="M60 530 C200 530 225 650 310 592 S460 510 560 530" stroke="#efb18d"/><path d="M60 660 C190 660 220 535 310 592 S470 700 560 660" stroke="#a4bca5"/><path d="M310 485 V707" stroke="#b0a0d0"/><ellipse cx="310" cy="592" rx="175" ry="90" stroke="#697d6b" stroke-dasharray="5 8"/></g><g fill="#f4f0e7" font-family="sans-serif" font-size="13"><text x="60" y="515">个人</text><text x="535" y="515">角色</text><text x="60" y="688">团队</text><text x="535" y="688">任务</text><text x="325" y="493">知识</text><rect x="247" y="571" width="126" height="42" rx="21" fill="#f4f0e7"/><text x="310" y="599" text-anchor="middle" fill="#20352e" font-size="18">持续责任</text><text x="45" y="793" font-size="12">五种形态 · 机制对照 · AbleWork 应用</text><text x="575" y="793" font-size="12" text-anchor="end">研究专刊</text></g></svg>